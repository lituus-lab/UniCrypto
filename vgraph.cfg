# Dependency directions checked by `nimble checkVGraph`. See ADR-0001.

# Layers inside src/, lowest first. A module may import its own layer and any
# lower one, never a higher one. A name matches a file (c_api -> c_api.nim)
# or a directory (hash -> hash/*.nim, hash/blake3/*.nim). Modules under no
# listed layer are unconstrained: the umbrella module re-exports everything.
# `cli` lives in bin/, outside src/, so it is not (and cannot be) a layer here.
# UniGeom would read:  types / algorithms / io
[layers]
cipher
hash
c_api

# Uni* engines this repo may name in `requires`. Any Uni* absent here is a
# back-edge in the family DAG. Non-Uni deps (nim, NimContracts, nimsimd) are
# external infra and go unchecked.
# UniGeom would read:  UniMath / UniLinalg / UniGraph / UniAccurate
[engines]

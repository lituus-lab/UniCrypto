[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "UniCrypto-lituus"
version = "0.1.0"
description = "Python binding for the UniCrypto C library"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lbartoletti" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools]
packages = ["unicrypto"]
